name: gsplat builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: /workdir

    env:
      TORCH_VER: "2.13.0"
      NUMPY_VER: "2.4.6"
      MAX_JOBS: 4

    steps:
      - name: Create workdir
        working-directory: /
        run: |
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
    
      - name: Cleanup disk
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with: 
          cuda: "12.9.2"
      
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          venv-path: ".venv"
          activate-environment: true
          enable-cache: false

      - name: Install python packages
        run: >
          uv pip install --link-mode=copy --no-build-isolation --index-strategy unsafe-best-match
          packaging setuptools wheel ninja build scikit_build_core cmake
          torch==${TORCH_VER} --extra-index-url https://download.pytorch.org/whl/cu129
          numpy==${NUMPY_VER}
    
      - name: Build gsplat
        run: |
          git clone --depth 1 --recursive https://github.com/nerfstudio-project/gsplat.git /workdir/gsplat
          mkdir /workdir/whl_bin
          cd /workdir/gsplat
          TORCH_CUDA_ARCH_LIST="8.9 9.0 9.0a" \
          uv build --wheel --no-build-isolation --verbose -o /workdir/whl_bin .
          ls /workdir/whl_bin
      
      - name: Build fused-ssim
        run: |
          git clone --depth=1 --recursive https://github.com/rahul-goel/fused-ssim.git /workdir/fused-ssim
          mkdir /workdir/whl_bin
          cd /workdir/fused-ssim
          CUDA_ARCHITECTURES="89;90;90a" \
          uv build --wheel --no-build-isolation --verbose -o /workdir/whl_bin .
          ls /workdir/whl_bin
      
      - name: Prepare upload file
        run: |
          cd /workdir/whl_bin 
          echo "TAG_NAME= _$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "UPLOAD_FILE=$PWD/*.whl" >> $GITHUB_ENV
      
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.UPLOAD_FILE }}
