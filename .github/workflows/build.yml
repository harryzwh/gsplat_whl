name: gsplat builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: /workdir

    env:
      TORCH_VER: "2.13.0"
      NUMPY_VER: "2.4.6"
      MAX_JOBS: 8

    steps:
      - name: Create workdir
        working-directory: /
        run: |
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
    
      - name: Cleanup disk
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with: 
          cuda: "12.9.2"
      
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          venv-path: ".venv"
          activate-environment: true
          enable-cache: false

      - name: Install python packages
        run: >
          uv pip install --link-mode=copy --no-build-isolation --index-strategy unsafe-best-match
          packaging setuptools wheel ninja build scikit_build_core cmake
          torch==${TORCH_VER} --extra-index-url https://download.pytorch.org/whl/cu129
          numpy==${NUMPY_VER}
    
      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/nerfstudio-project/gsplat.git /workdir/gsplat
      
      - name: Build whl
        run: |
          mkdir /workdir/whl_bin
          cd /workdir/gsplat
          TORCH_CUDA_ARCH_LIST="8.9 9.0 9.0a" \
          uv build --wheel --no-build-isolation --verbose -o /workdir/whl_bin .
          echo "BUILD_STATUS=success" >> $GITHUB_ENV
          ls /workdir/whl_bin
